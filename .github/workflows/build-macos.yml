name: build-macos
run-name: macOS build of ${{ github.ref_name }}

# The macOS app for Apple Silicon and for Intel Macs, each built and started
# once on its own runner. build.yml calls it for a release tag: then each
# arch also hands over its .dmg and its signed updater archive
# (ToBeVPN_<version>_<arch>.app.tar.gz + .sig) for the release and latest.json.
on:
  push:
    branches: [macos]
  workflow_dispatch:
  workflow_call:

jobs:
  macos:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
            runner: macos-latest
          # A real Intel Mac: the Intel build is built and started natively,
          # not through Rosetta.
          - arch: x64
            triple: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
          targets: ${{ matrix.triple }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.arch }}

      - name: Sidecars and routing data
        env:
          GH_TOKEN: ${{ github.token }}
          MACOS_ARCH: ${{ matrix.arch }}
        run: bash scripts/ci-macos-assets.sh

      - name: Install npm deps
        run: npm ci

      - name: Check Rust core
        # Once, on the runner's own architecture.
        if: matrix.arch == 'arm64'
        working-directory: src-tauri
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

      - name: Tunnel test (automatic routing)
        # The VPN path on a real Mac: helper, tun2socks, routes, DNS and
        # Xray's routing rules, with Russian sites leaving directly.
        if: matrix.arch == 'arm64'
        continue-on-error: true
        run: bash scripts/ci-macos-tunnel-test.sh

      - name: Inject backend hostnames
        env:
          BOT_API_HOST: ${{ secrets.BOT_API_HOST || 'example.invalid' }}
          PANEL_HOST: ${{ secrets.PANEL_HOST || 'example.invalid' }}
          SUBSCRIPTION_HOST: ${{ secrets.SUBSCRIPTION_HOST || 'example.invalid' }}
          VITE_FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN || 'https://example.invalid/' }}
          VITE_FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN || 'https://example.invalid/' }}
        run: bash scripts/inject-backend-host.sh

      - name: Build .app and .dmg
        run: npx tauri build --bundles app,dmg --target ${{ matrix.triple }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_BOT_API_URL: https://${{ secrets.BOT_API_HOST || 'example.invalid' }}/
          VITE_PANEL_URL: https://${{ secrets.PANEL_HOST || 'example.invalid' }}
          VITE_SUBSCRIPTION_URL: https://${{ secrets.SUBSCRIPTION_HOST || 'example.invalid' }}/
          VITE_FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN || 'https://example.invalid/' }}
          VITE_FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN || 'https://example.invalid/' }}

      - name: Start the app once
        # The runner has a logged-in desktop: the app is started from the
        # built bundle, left for 20 s, then its window is captured. The Intel
        # build runs through Rosetta, when the runner has it.
        run: |
          set -euo pipefail
          APP=$(ls -d src-tauri/target/${{ matrix.triple }}/release/bundle/macos/*.app | head -1)
          ls "$APP/Contents/MacOS" "$APP/Contents/Resources/bin" || true
          mkdir -p smoke
          "$APP/Contents/MacOS/tobevpn-desktop" > smoke/app.log 2>&1 &
          APP_PID=$!
          sleep 30
          screencapture -x smoke/screen.png || true
          # How macOS itself starts it, as a user would (Finder / open).
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5 || true
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "The app is running"
            kill "$APP_PID" || true
          else
            echo "::error::The app exited on its own"
            tail -50 smoke/app.log
            exit 1
          fi
          tail -30 smoke/app.log
          # Then as a user starts it: through Launch Services (Finder, open).
          sleep 3
          cp -R "$APP" /tmp/ToBeVPN.app
          xattr -dr com.apple.quarantine /tmp/ToBeVPN.app 2>/dev/null || true
          open /tmp/ToBeVPN.app 2>&1 | tee smoke/open.log
          sleep 30
          screencapture -x smoke/screen-open.png || true
          if pgrep -f /tmp/ToBeVPN.app/Contents/MacOS/tobevpn-desktop >/dev/null; then
            echo "Started through open"
            pkill -f /tmp/ToBeVPN.app/Contents/MacOS/tobevpn-desktop || true
          else
            echo "::error::open did not start the app"
            log show --last 2m --predicate 'process == "launchd" OR subsystem == "com.apple.launchservices"' 2>/dev/null | grep -i tobevpn | tail -20 || true
            exit 1
          fi

      - name: Release files
        # Tauri names the updater archive ToBeVPN.app.tar.gz for both archs;
        # the release needs one per arch, named like the .dmg. A manual run
        # hands them over too (to add a Mac build to a published release).
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version package.json)
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$VERSION" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::package.json version $VERSION does not match tag $GITHUB_REF_NAME"
            exit 1
          fi
          ARCH=$([ "${{ matrix.arch }}" = arm64 ] && echo aarch64 || echo x64)
          BUNDLE=src-tauri/target/${{ matrix.triple }}/release/bundle
          mkdir -p release
          cp "$BUNDLE"/macos/*.app.tar.gz "release/ToBeVPN_${VERSION}_${ARCH}.app.tar.gz"
          cp "$BUNDLE"/macos/*.app.tar.gz.sig "release/ToBeVPN_${VERSION}_${ARCH}.app.tar.gz.sig"
          cp "$BUNDLE"/dmg/*.dmg "release/ToBeVPN_${VERSION}_${ARCH}.dmg"
          test -s "release/ToBeVPN_${VERSION}_${ARCH}.app.tar.gz.sig"
          ls -la release

      - if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ToBeVPN-macos-${{ matrix.arch }}-release
          path: release/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: always()
        with:
          name: ToBeVPN-macos-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            smoke/
            tunnel-test/
          if-no-files-found: warn
          # Built clients carry runtime configuration: short-lived only.
          retention-days: 3
