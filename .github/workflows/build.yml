name: build
run-name: >-
  ${{ inputs.run_title || github.event.head_commit.message || github.event_name == 'pull_request' && format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) || format('Build {0}', github.ref_name) }}

on:
  # Direct pushes to main don't ship anything — releases live on tags. PRs
  # still get a sanity build before merge, and workflow_dispatch is kept
  # for manual reruns. This avoids running the Tauri signing pipeline
  # twice when a release commit is pushed alongside its tag.
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_title:
        description: 'Optional display title for manual release reruns'
        required: false
        type: string

jobs:
  # Security gate — runs first, blocks builds when a known CVE is in the
  # dependency tree. Catches incidents like postcss XSS / rustls-webpki CRL
  # panic that we patched manually during the recent audit.
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Require fallback endpoints for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}
        run: |
          validate_endpoint() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error::${name} is required for a release build"
              exit 1
            fi
            case "$value" in
              *your-*|*example.invalid*|*'<'*|*'>'*|*__*)
                echo "::error::${name} still contains a placeholder value"
                exit 1
                ;;
            esac
            if [[ "$value" != https://* ]]; then
              echo "::error::${name} must be an HTTPS URL"
              exit 1
            fi
          }
          validate_endpoint FALLBACK_BOT_DOMAIN "$FALLBACK_BOT_DOMAIN"
          validate_endpoint FALLBACK_SUBS_DOMAIN "$FALLBACK_SUBS_DOMAIN"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: npm audit (production deps, high+ blocks)
        run: npm audit --omit=dev --audit-level=high

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

  build-linux:
    needs: audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Download Linux sidecar binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p src-tauri/bin
          mkdir -p public/routing

          download_verified_release_asset() {
            local repo="$1"
            local asset_name="$2"
            local output="$3"
            local metadata
            metadata=$(gh api "repos/${repo}/releases/latest")
            local url
            local digest
            url=$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .browser_download_url' <<<"$metadata")
            digest=$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest' <<<"$metadata")
            if [ -z "$url" ] || [ "$url" = "null" ] || [[ "$digest" != sha256:* ]]; then
              echo "::error::Could not resolve a verified ${repo}/${asset_name} release asset"
              exit 1
            fi
            curl -fsSL -o "$output" "$url"
            echo "${digest#sha256:}  ${output}" | sha256sum -c -
          }

          extract_plain_category_domains() {
            local input="$1"
            local output="$2"
            shift 2
            local categories="$*"
            awk -v categories="$categories" '
              BEGIN {
                split(categories, items, " ")
                for (i in items) {
                  keep[items[i]] = 1
                }
              }
              /^  - name: / { in_category = ($3 in keep); next }
              in_category && /^      - "/ {
                rule=$0
                sub(/^      - "/, "", rule)
                sub(/"$/, "", rule)
                split(rule, parts, ":")
                if ((parts[1] == "domain" || parts[1] == "full") && parts[2] != "") {
                  if (parts[2] !~ /\./) print "*." parts[2]
                  else print parts[2]
                }
              }
            ' "$input" | sort -u > "$output"
            grep -qx 'avito.ru' "$output"
            grep -qx 'ozon.ru' "$output"
            grep -qx 'wildberries.ru' "$output"
            grep -qx '*.ru' "$output"
          }

          append_plain_domain_list() {
            local input="$1"
            local output="$2"
            awk '
              {
                sub(/[[:space:]]+#.*$/, "")
                for (i = 1; i <= NF; i++) {
                  domain = tolower($i)
                  sub(/^\*\./, "", domain)
                  if (domain ~ /^include:/ || domain !~ /\./) next
                  if (domain ~ /^[a-z0-9_.-]+$/) print domain
                }
              }
            ' "$input" >> "$output"
            sort -u -o "$output" "$output"
            grep -qx 'yandex.ru' "$output"
            grep -qx 'ozon.ru' "$output"
          }

          echo "Downloading Xray-core (Linux x64)..."
          curl -fsSL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -o xray.zip -d xray-extracted
          cp xray-extracted/xray src-tauri/bin/xray-x86_64-unknown-linux-gnu
          chmod +x src-tauri/bin/xray-x86_64-unknown-linux-gnu

          echo "Downloading automatic routing rules..."
          download_verified_release_asset \
            runetfreedom/russia-v2ray-rules-dat geosite.dat src-tauri/bin/geosite.dat
          download_verified_release_asset \
            runetfreedom/russia-v2ray-rules-dat geoip.dat src-tauri/bin/geoip.dat
          download_verified_release_asset \
            v2fly/domain-list-community dlc.dat_plain.yml dlc.dat_plain.yml
          curl -fsSL -o ru-available-only-inside.txt \
            https://raw.githubusercontent.com/runetfreedom/russia-domains-list/main/ru-available-only-inside
          extract_plain_category_domains \
            dlc.dat_plain.yml public/routing/ru-services.txt \
            category-bank-ru \
            category-betting-ru \
            category-ecommerce-ru \
            category-entertainment-ru \
            category-gov-ru \
            category-media-ru \
            category-medicine-ru \
            category-retail-ru \
            category-ru \
            category-travel-ru
          append_plain_domain_list \
            ru-available-only-inside.txt public/routing/ru-services.txt

          XRAY_LOCATION_ASSET=src-tauri/bin \
            src-tauri/bin/xray-x86_64-unknown-linux-gnu \
            run -test -config scripts/xray-routing-assets-test.json

          echo "Downloading tun2socks (Linux amd64)..."
          curl -fsSL -o tun2socks.zip \
            https://github.com/xjasonlyu/tun2socks/releases/latest/download/tun2socks-linux-amd64.zip
          unzip -o tun2socks.zip -d tun2socks-extracted
          cp tun2socks-extracted/tun2socks-linux-amd64 \
             src-tauri/bin/tun2socks-x86_64-unknown-linux-gnu
          chmod +x src-tauri/bin/tun2socks-x86_64-unknown-linux-gnu

          echo "--- bin/ contents ---"
          ls -la src-tauri/bin

      - name: Install npm deps
        run: npm ci

      - name: Inject backend hostnames
        # tauri.conf.json and capabilities/default.json carry __BOT_API_HOST__
        # / __PANEL_HOST__ placeholders in source so the public repo never
        # leaks production domains. We substitute the real hosts here from
        # CI secrets right before the build.
        env:
          BOT_API_HOST: ${{ secrets.BOT_API_HOST }}
          PANEL_HOST: ${{ secrets.PANEL_HOST }}
          SUBSCRIPTION_HOST: ${{ secrets.SUBSCRIPTION_HOST }}
          VITE_FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          VITE_FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}
        run: bash scripts/inject-backend-host.sh

      - name: Build Linux .deb
        # TAURI_SIGNING_* are passed only for tag pushes — that's when Tauri's
        # bundler emits a .sig file alongside the .deb so the updater plugin
        # can verify the bundle on the user's machine. For branch pushes the
        # secrets are absent and Tauri skips signing, which is fine: those
        # builds aren't published to the GitHub Release.
        # When TAURI_SIGNING_PRIVATE_KEY is set, the bundler auto-emits a
        # .sig file alongside each .deb (driven by createUpdaterArtifacts in
        # tauri.conf.json — the explicit "updater" target is not a real
        # bundle type).
        run: npx tauri build --bundles deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_BOT_API_URL: https://${{ secrets.BOT_API_HOST }}/
          VITE_PANEL_URL: https://${{ secrets.PANEL_HOST }}
          VITE_SUBSCRIPTION_URL: https://${{ secrets.SUBSCRIPTION_HOST }}/
          # The audit job above rejects empty or placeholder release values.
          VITE_FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          VITE_FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}

      # Built clients contain runtime configuration. Keep disposable branch
      # validation binaries on the runner; publish installers only for releases.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: ToBeVPN-linux-deb
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig
          if-no-files-found: error
          # Short retention so old releases can't be revived by downloading
          # the CI artifact in this public repo. The Release page is the
          # only canonical distribution point.
          retention-days: 7

  build-windows:
    needs: audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Download Windows sidecar binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path src-tauri/bin | Out-Null
          New-Item -ItemType Directory -Force -Path public/routing | Out-Null

          function Download-VerifiedReleaseAsset {
            param(
              [string]$Repository,
              [string]$AssetName,
              [string]$Output
            )
            $release = gh api "repos/$Repository/releases/latest" | ConvertFrom-Json
            $asset = $release.assets | Where-Object { $_.name -eq $AssetName } | Select-Object -First 1
            if (-not $asset -or -not $asset.digest -or -not $asset.digest.StartsWith("sha256:")) {
              throw "Could not resolve a verified $Repository/$AssetName release asset"
            }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $Output
            $expected = $asset.digest.Substring(7).ToLowerInvariant()
            $actual = (Get-FileHash -Algorithm SHA256 $Output).Hash.ToLowerInvariant()
            if ($actual -ne $expected) {
              throw "SHA-256 mismatch for $Repository/$AssetName"
            }
          }

          function Export-PlainCategoryDomains {
            param(
              [string[]]$Categories,
              [string]$InputPath,
              [string]$OutputPath
            )
            $inCategory = $false
            $domains = [System.Collections.Generic.HashSet[string]]::new()
            Get-Content $InputPath | ForEach-Object {
              if ($_ -match '^  - name: (.+)$') {
                $inCategory = $Categories -contains $Matches[1]
                return
              }
              if ($inCategory -and $_ -match '^      - "(domain|full):([^":]+)(?::[^"]*)?"$') {
                $domain = $Matches[2]
                if (-not $domain.Contains(".")) {
                  $domain = "*.$domain"
                }
                [void]$domains.Add($domain)
              }
            }
            $sorted = $domains | Sort-Object
            $outputDir = (Resolve-Path (Split-Path $OutputPath -Parent)).Path
            $outputFile = Join-Path $outputDir (Split-Path $OutputPath -Leaf)
            [System.IO.File]::WriteAllLines($outputFile, $sorted, [System.Text.UTF8Encoding]::new($false))
            foreach ($required in @("avito.ru", "ozon.ru", "wildberries.ru")) {
              if (-not $domains.Contains($required)) {
                throw "Missing required domain $required in Russian services list"
              }
            }
            if (-not $domains.Contains("*.ru")) {
              throw "Missing required wildcard *.ru in Russian services list"
            }
          }

          function Add-PlainDomainList {
            param(
              [string]$InputPath,
              [string]$OutputPath
            )
            $domains = [System.Collections.Generic.HashSet[string]]::new()
            if (Test-Path $OutputPath) {
              Get-Content $OutputPath | ForEach-Object {
                $domain = $_.Trim().ToLowerInvariant()
                if ($domain) { [void]$domains.Add($domain) }
              }
            }
            Get-Content $InputPath | ForEach-Object {
              $line = ($_ -replace '\s+#.*$', '').Trim()
              if ($line) {
                foreach ($part in ($line -split '\s+')) {
                  $domain = $part.Trim().TrimStart([char[]]"*.").ToLowerInvariant()
                  if ($domain.StartsWith("include:") -or -not $domain.Contains(".")) { continue }
                  if ($domain -match '^[a-z0-9_.-]+$') {
                    [void]$domains.Add($domain)
                  }
                }
              }
            }
            $sorted = $domains | Sort-Object
            $outputDir = (Resolve-Path (Split-Path $OutputPath -Parent)).Path
            $outputFile = Join-Path $outputDir (Split-Path $OutputPath -Leaf)
            [System.IO.File]::WriteAllLines($outputFile, $sorted, [System.Text.UTF8Encoding]::new($false))
            foreach ($required in @("yandex.ru", "ozon.ru")) {
              if (-not $domains.Contains($required)) {
                throw "Missing required domain $required in Russian services list"
              }
            }
          }

          Write-Host "Downloading Xray-core (Windows x64)..."
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile xray.zip
          Expand-Archive -Path xray.zip -DestinationPath xray-extracted -Force
          Copy-Item xray-extracted/xray.exe src-tauri/bin/xray-x86_64-pc-windows-msvc.exe

          Write-Host "Downloading automatic routing rules..."
          Download-VerifiedReleaseAsset `
            -Repository "runetfreedom/russia-v2ray-rules-dat" `
            -AssetName "geosite.dat" `
            -Output "src-tauri/bin/geosite.dat"
          Download-VerifiedReleaseAsset `
            -Repository "runetfreedom/russia-v2ray-rules-dat" `
            -AssetName "geoip.dat" `
            -Output "src-tauri/bin/geoip.dat"
          Download-VerifiedReleaseAsset `
            -Repository "v2fly/domain-list-community" `
            -AssetName "dlc.dat_plain.yml" `
            -Output "dlc.dat_plain.yml"
          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/runetfreedom/russia-domains-list/main/ru-available-only-inside" `
            -OutFile "ru-available-only-inside.txt"
          $ruCategories = @(
            "category-bank-ru",
            "category-betting-ru",
            "category-ecommerce-ru",
            "category-entertainment-ru",
            "category-gov-ru",
            "category-media-ru",
            "category-medicine-ru",
            "category-retail-ru",
            "category-ru",
            "category-travel-ru"
          )
          Export-PlainCategoryDomains `
            -Categories $ruCategories `
            -InputPath "dlc.dat_plain.yml" `
            -OutputPath "public/routing/ru-services.txt"
          Add-PlainDomainList `
            -InputPath "ru-available-only-inside.txt" `
            -OutputPath "public/routing/ru-services.txt"

          $env:XRAY_LOCATION_ASSET = (Resolve-Path "src-tauri/bin").Path
          & src-tauri/bin/xray-x86_64-pc-windows-msvc.exe `
            run -test -config scripts/xray-routing-assets-test.json
          if ($LASTEXITCODE -ne 0) {
            throw "XRay rejected the automatic routing assets"
          }

          Write-Host "Downloading tun2socks (Windows amd64)..."
          Invoke-WebRequest -Uri "https://github.com/xjasonlyu/tun2socks/releases/latest/download/tun2socks-windows-amd64.zip" -OutFile tun2socks.zip
          Expand-Archive -Path tun2socks.zip -DestinationPath tun2socks-extracted -Force
          Copy-Item tun2socks-extracted/tun2socks-windows-amd64.exe src-tauri/bin/tun2socks-x86_64-pc-windows-msvc.exe

          Write-Host "Downloading Wintun driver..."
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile wintun.zip
          Expand-Archive -Path wintun.zip -DestinationPath wintun-extracted -Force
          Copy-Item wintun-extracted/wintun/bin/amd64/wintun.dll src-tauri/bin/wintun.dll

          Write-Host "--- bin/ contents ---"
          Get-ChildItem src-tauri/bin

      - name: Install npm deps
        run: npm ci

      - name: Inject backend hostnames
        shell: bash
        env:
          BOT_API_HOST: ${{ secrets.BOT_API_HOST }}
          PANEL_HOST: ${{ secrets.PANEL_HOST }}
          SUBSCRIPTION_HOST: ${{ secrets.SUBSCRIPTION_HOST }}
          VITE_FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          VITE_FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}
        run: bash scripts/inject-backend-host.sh

      - name: Build Windows .exe (NSIS)
        run: npx tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_BOT_API_URL: https://${{ secrets.BOT_API_HOST }}/
          VITE_PANEL_URL: https://${{ secrets.PANEL_HOST }}
          VITE_SUBSCRIPTION_URL: https://${{ secrets.SUBSCRIPTION_HOST }}/
          VITE_FALLBACK_BOT_DOMAIN: ${{ secrets.FALLBACK_BOT_DOMAIN }}
          VITE_FALLBACK_SUBS_DOMAIN: ${{ secrets.FALLBACK_SUBS_DOMAIN }}

      # Built clients contain runtime configuration. Keep disposable branch
      # validation binaries on the runner; publish installers only for releases.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          # GitHub Actions always wraps uploaded artifacts in a zip; we can't
          # ship a bare .exe through this API. The archive contains a single
          # ready-to-run installer .exe inside, plus the .sig file the
          # tauri-plugin-updater verifies before applying the update.
          name: ToBeVPN-windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 7

  # Tag-triggered: when push refs/tags/v*, attach both artifacts to a
  # GitHub Release. Branch/PR/manual builds validate compilation without
  # uploading distributable binaries.
  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Generate Tauri updater manifest (latest.json)
        # The updater plugin (tauri-plugin-updater) on each user device fetches
        # this manifest from the configured endpoint and uses the embedded
        # ed25519 signature to verify the bundle before applying. The format
        # is the standard one Tauri expects: `version`, `pub_date`, and a
        # `platforms` map keyed by `os-arch`. We only build for x86_64 today.
        run: |
          set -e
          VERSION="${GITHUB_REF_NAME#v}"
          DEB=$(find dist/ToBeVPN-linux-deb -name "*.deb" -not -name "*.sig" | head -1)
          DEB_SIG=$(find dist/ToBeVPN-linux-deb -name "*.deb.sig" | head -1)
          EXE=$(find dist/ToBeVPN-windows-exe -name "*.exe" -not -name "*.sig" | head -1)
          EXE_SIG=$(find dist/ToBeVPN-windows-exe -name "*.exe.sig" | head -1)

          if [ -z "$DEB" ] || [ -z "$DEB_SIG" ] || [ -z "$EXE" ] || [ -z "$EXE_SIG" ]; then
            echo "::error::Missing one of: deb=$DEB sig=$DEB_SIG exe=$EXE sig=$EXE_SIG"
            ls -R dist/
            exit 1
          fi

          DEB_NAME=$(basename "$DEB")
          EXE_NAME=$(basename "$EXE")
          DEB_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${DEB_NAME}"
          EXE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${EXE_NAME}"
          DEB_SIG_CONTENT=$(cat "$DEB_SIG")
          EXE_SIG_CONTENT=$(cat "$EXE_SIG")

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "linux-x86_64": {
                "signature": "${DEB_SIG_CONTENT}",
                "url": "${DEB_URL}"
              },
              "windows-x86_64": {
                "signature": "${EXE_SIG_CONTENT}",
                "url": "${EXE_URL}"
              }
            }
          }
          EOF
          echo "--- latest.json ---"
          cat latest.json

      - name: Generate release notes
        run: |
          set -e
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | awk -v current="$GITHUB_REF_NAME" '$0 != current { print; exit }')

          if [ -n "$PREVIOUS_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${GITHUB_REF_NAME}" > release-notes.md
          else
            echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ToBeVPN-linux-deb/*.deb
            dist/ToBeVPN-linux-deb/*.deb.sig
            dist/ToBeVPN-windows-exe/*.exe
            dist/ToBeVPN-windows-exe/*.exe.sig
            latest.json
          body_path: release-notes.md
