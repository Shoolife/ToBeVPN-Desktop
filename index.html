<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ToBeVPN</title>
    <script>
      if (navigator.userAgent.includes("Windows") || navigator.userAgent.includes("Linux")) {
        document.documentElement.dataset.windowFrame = "desktop";
        // Transparent until App applies the startup window size.
        document.documentElement.dataset.presenting = "1";
      }
    </script>
    <script src="/theme-boot.js"></script>
    <style>
      :root,
      :root[data-theme="dark"] {
        --initial-bg: #0d0d0d;
      }
      :root[data-theme="light"] {
        --initial-bg: #ffffff;
      }
      html, body {
        background: var(--initial-bg);
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      html[data-window-frame="desktop"],
      html[data-window-frame="desktop"] body {
        background: transparent;
      }
      body { display: block; }
      #window-clip {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      /* Keep the only outer clipping curve outside the transformed frame.
         Rasterising the radius before a 0.9 transform leaves its edge between
         physical pixels and makes the transparent corners look jagged. */
      html[data-presenting] #window-clip {
        opacity: 0;
      }
      html[data-window-frame="desktop"] #window-clip {
        background: transparent;
        border-radius: 14px;
        overflow: hidden;
      }
      /* The app is designed around 494x895, but the outer frame expands in
         unscaled CSS pixels so that after transform scaling it covers the
         whole native window. This avoids side gutters on short Windows
         viewports instead of hiding them with a matching background color. */
      #scale-frame {
        width: var(--app-frame-width, 100vw);
        height: var(--app-frame-height, 100vh);
        background: var(--initial-bg);
        transform: scale(var(--app-scale, 1));
        transform-origin: top left;
        position: relative;
      }
      html[data-window-frame="desktop"] #scale-frame {
        background: transparent;
      }
      /* Shown while the window changes between portrait and landscape (see
         App.tsx, windowMorph). It lives outside #scale-frame, so it keeps its
         size and stays centred in the content area while the window moves. */
      #window-morph-loader {
        position: absolute;
        left: 50%;
        top: calc(50% + 15px);
        width: 84px;
        height: 84px;
        margin: -42px 0 0 -42px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 200ms ease;
      }
      html[data-window-morph] #window-morph-loader {
        opacity: 1;
      }
      /* Explicit sizes: WebKitGTK gives an inset-only SVG its 300x150
         default size, which pushed the shield off the ring's centre. */
      #window-morph-loader .morph-ring {
        position: absolute;
        left: 0;
        top: 0;
        width: 84px;
        height: 84px;
        display: block;
        transform-origin: 50% 50%;
        animation: window-morph-spin 900ms linear infinite;
      }
      #window-morph-loader .morph-shield {
        position: absolute;
        left: 19px;
        top: 19px;
        width: 46px;
        height: 46px;
        display: block;
        transform-origin: 50% 50%;
        filter: drop-shadow(0 0 10px rgba(8, 192, 205, 0.45));
        animation: window-morph-pulse 1200ms ease-in-out infinite alternate;
      }
      @keyframes window-morph-spin {
        to { transform: rotate(360deg); }
      }
      @keyframes window-morph-pulse {
        from { transform: scale(0.94); }
        to { transform: scale(1.04); }
      }
      #root { width: 100%; height: 100%; }
      /* Dedicated overlay layer for the in-app updater banner. Lives as a
         sibling of #root inside #scale-frame so it inherits the same
         transform — without that the banner would render at its
         pre-scale 494px width on a shrunken window and clip past the
         right edge. */
      #overlay-root {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 0;
        pointer-events: none;
        z-index: 10000;
      }
      #overlay-root > * { pointer-events: auto; }
    </style>
  </head>

  <body>
    <div id="window-clip">
      <div id="scale-frame">
        <div id="root"></div>
        <div id="overlay-root"></div>
      </div>
      <div id="window-morph-loader" aria-hidden="true">
        <svg class="morph-ring" viewBox="0 0 84 84">
          <defs>
            <linearGradient id="morph-ring-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#00deac" />
              <stop offset="1" stop-color="#0fa2ed" stop-opacity="0" />
            </linearGradient>
          </defs>
          <circle cx="42" cy="42" r="39" fill="none" stroke="rgba(127,127,127,0.18)" stroke-width="3" />
          <circle cx="42" cy="42" r="39" fill="none" stroke="url(#morph-ring-gradient)" stroke-width="3"
            stroke-linecap="round" stroke-dasharray="150 95" />
        </svg>
        <svg class="morph-shield" viewBox="0 0 2048 2048">

            </linearGradient>

        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
